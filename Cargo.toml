[package]
name = "per-man"
version = "0.1.0"
authors = ["hatem.benbelgacem@outlook.com <hatem.benbelgacem@outlook.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = {version ="0.4.42", features = ["serde"]}
dioxus = { version = "0.6.0", features = ["router", "fullstack"] }
serde = { version = "1.0.215", features = ["derive"] }
sqlx = { version="0.8.3", features = [ "postgres", "runtime-tokio", "chrono", "uuid" ], optional = true}

tokio = { version = "1.48.0", features = ["full"], optional = true }
icons = { version = "0.1.0", features = ["dioxus"] }
num-format = "0.4"
uuid = { version = "1.11", features = ["v4", "serde"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
dotenv = "0.15"
wasm-bindgen = "=0.2.100"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "sqlx", "dep:tokio"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[toolchain]
channel = "nightly"